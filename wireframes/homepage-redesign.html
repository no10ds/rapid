<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rAPId — Homepage Redesign</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ec4899;
      --pink-dim: #be185d;
      --pink-faint: rgba(236,72,153,.07);
      --sidebar: #1e2128;
      --sidebar-border: #2a2d35;
      --sidebar-hover: rgba(255,255,255,.04);
      --bg: #eef0f3;
      --white: #ffffff;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-tertiary: #9ca3af;
      --radius: 8px;
      --radius-sm: 5px;
      --sidebar-w: 240px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shell ─────────────────────────────────────────── */
    .shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ───────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .sidebar::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 1px;
      background: var(--sidebar-border);
    }

    .sb-header {
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--sidebar-border);
      background: #fff;
      overflow: hidden;
    }

    .logo-img {
      flex: 1;
      min-width: 0;
      height: 100%;
      object-fit: contain;
      object-position: center;
      padding: 8px 12px;
    }

    .sb-sec { padding: 20px 8px 4px; flex-shrink: 0; }
    .sb-sec:first-of-type { padding-top: 12px; }

    .sb-sec-lbl {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #9ca3af;
      padding: 0 8px;
      margin-bottom: 3px;
      white-space: nowrap;
    }

    .ni {
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 8px;
      cursor: pointer;
      transition: background .12s;
      position: relative;
      overflow: hidden;
      margin-bottom: 1px;
    }

    .ni:hover { background: var(--sidebar-hover); }
    .ni.act { background: rgba(236,72,153,.1); }

    .ni.act::before {
      content: '';
      position: absolute;
      left: 0; top: 6px; bottom: 6px;
      width: 2px;
      background: var(--pink);
      border-radius: 0 2px 2px 0;
    }

    .ni-ico {
      width: 20px; height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9ced6;
    }

    .ni-ico svg { width: 17px; height: 17px; }
    .ni-ico svg.stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ni.act .ni-ico { color: var(--pink); }

    .ni-lbl {
      font-size: 12px;
      font-weight: 400;
      color: #d1d5db;
      white-space: nowrap;
      letter-spacing: .01em;
    }

    .ni.act .ni-lbl { color: #e8eaed; font-weight: 500; }

    .ni-badge {
      margin-left: auto;
      background: var(--pink);
      color: white;
      font-size: 9px;
      font-weight: 600;
      border-radius: 10px;
      padding: 1px 6px;
      flex-shrink: 0;
      letter-spacing: .02em;
    }

    .sb-foot {
      margin-top: auto;
      padding: 10px 8px;
      border-top: 1px solid var(--sidebar-border);
    }

    .usr {
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 6px;
      cursor: pointer;
      transition: background .12s;
    }

    .usr:hover { background: var(--sidebar-hover); }

    .ava {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--pink-dim));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: white;
      letter-spacing: .02em;
    }

    .usr-name { font-size: 12px; font-weight: 500; color: #d1d5db; white-space: nowrap; }
    .usr-role { font-size: 10px; color: #9ca3af; white-space: nowrap; font-weight: 400; }

    /* ── Main area ─────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      min-width: 0;
    }

    .topbar {
      height: 64px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      flex-shrink: 0;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -.01em;
    }

    .content { flex: 1; overflow-y: auto; }

    /* ── Hero ──────────────────────────────────────────── */
    @keyframes heroGlow {
      0%, 100% { opacity: .6; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.05); }
    }

    @keyframes waveFloat {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(-15px) translateY(-8px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero {
      background: var(--sidebar);
      position: relative;
      overflow: hidden;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 70% at 65% 55%, rgba(236,72,153,.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 25% 65%, rgba(139,92,246,.06) 0%, transparent 60%),
        radial-gradient(ellipse 45% 45% at 80% 25%, rgba(59,130,246,.05) 0%, transparent 55%);
      pointer-events: none;
      animation: heroGlow 10s ease-in-out infinite;
    }

    .hero-wave {
      position: absolute;
      bottom: -20%; left: -10%; right: -10%;
      height: 65%;
      background:
        repeating-linear-gradient(
          172deg,
          transparent, transparent 47%,
          rgba(236,72,153,.03) 48%,
          rgba(236,72,153,.015) 52%,
          transparent 53%
        );
      pointer-events: none;
      animation: waveFloat 14s ease-in-out infinite;
    }

    .hero-wave-2 {
      position: absolute;
      bottom: -10%; left: -5%; right: -5%;
      height: 50%;
      background:
        repeating-linear-gradient(
          168deg,
          transparent, transparent 46%,
          rgba(255,255,255,.015) 47%,
          rgba(255,255,255,.008) 53%,
          transparent 54%
        );
      pointer-events: none;
      animation: waveFloat 18s ease-in-out infinite reverse;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeUp .5s ease-out;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 700;
      color: #f1f3f5;
      letter-spacing: -.03em;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .hero-sub {
      font-size: 14px;
      color: rgba(255,255,255,.55);
      font-weight: 400;
      line-height: 1.7;
      max-width: 440px;
      margin-bottom: 28px;
    }

    .hero-ctas {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cta-primary {
      height: 40px;
      padding: 0 24px;
      border-radius: var(--radius);
      background: var(--pink);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(236,72,153,.35);
      transition: opacity .15s, transform .15s;
    }

    .cta-primary:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    .hero-links {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-link {
      height: 28px;
      padding: 0 12px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.5);
      border: 1px solid rgba(255,255,255,.08);
      transition: background .15s, color .15s;
    }

    .hero-link:hover {
      background: rgba(255,255,255,.1);
      color: rgba(255,255,255,.8);
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sb-header">
        <img class="logo-img" src="../frontend/public/img/logo.png" alt="rAPId">
      </div>
      <div class="sb-sec">
        <div class="ni act">
          <div class="ni-ico"><svg class="stroke" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
          <div class="ni-lbl">Dashboard</div>
        </div>
      </div>
      <div class="sb-sec">
        <div class="sb-sec-lbl">Data</div>
        <div class="ni">
          <div class="ni-ico"><svg class="stroke" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
          <div class="ni-lbl">Catalog</div>
        </div>
        <div class="ni">
          <div class="ni-ico"><svg class="stroke" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
          <div class="ni-lbl">Upload</div>
        </div>
        <div class="ni">
          <div class="ni-ico"><svg class="stroke" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="ni-lbl">Create Schema</div>
        </div>
      </div>
      <div class="sb-sec">
        <div class="sb-sec-lbl">Jobs</div>
        <div class="ni">
          <div class="ni-ico"><svg class="stroke" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="5" rx="2"/><rect x="2" y="14" width="20" height="5" rx="2"/></svg></div>
          <div class="ni-lbl">Jobs</div>
          <div class="ni-badge">3</div>
        </div>
      </div>
      <div class="sb-sec">
        <div class="sb-sec-lbl">Admin</div>
        <div class="ni">
          <div class="ni-ico"><svg class="stroke" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="23" y1="11" y2="11"/><line x1="20" x2="20" y1="8" y2="14"/></svg></div>
          <div class="ni-lbl">User Admin</div>
        </div>
      </div>
      <div class="sb-foot">
        <div class="usr">
          <div class="ava">AM</div>
          <div class="usr-info">
            <div class="usr-name">Abigail M.</div>
            <div class="usr-role">User Admin</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-title">Dashboard</div>
      </div>

      <div class="content">
        <div class="hero">
          <div class="hero-glow"></div>
          <div class="hero-wave"></div>
          <div class="hero-wave-2"></div>
          <div class="hero-inner">
            <h1 class="hero-title">Welcome to rAPId</h1>
            <p class="hero-sub">
              Your centralised platform for sharing, discovering and managing datasets.
            </p>
            <div class="hero-ctas">
              <a href="#" class="cta-primary">
                Explore the Catalog
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
              </a>
            </div>
            <div class="hero-links">
              <a href="#" class="hero-link">View the API docs</a>
              <a href="#" class="hero-link">See the source code</a>
              <a href="#" class="hero-link">Contact</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
